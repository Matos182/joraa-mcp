worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;

    # Clientes lentos não seguram ligações: cabeçalhos e corpo em 10 s, keepalive de 15 s.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;

    limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=other:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # 429 indica excesso de pedidos e leva os clientes a abrandar; 503 pareceria uma indisponibilidade.
    limit_req_status 429;
    limit_conn_status 429;

    upstream joraa {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    ssl_certificate /etc/nginx/certs/joraa.crt;
    ssl_certificate_key /etc/nginx/certs/joraa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Perfil "intermediate" do TLSRef (sucessor do Mozilla SSL Config, guidelines 6.0).
    # Sem isto o TLS 1.2 usaria o valor por omissão HIGH:!aNULL:!MD5, que ainda aceita CBC sem ECDHE.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Sem HTTP: 301/302 podem transformar POST em GET; com 307/308 o corpo JSON-RPC
    # já teria passado em claro. Os clientes MCP usam um URL https, sem superfície em claro.
    # Não se inclui conf.d/*.conf: o default.conf da imagem abriria a porta 80 no anfitrião.

    # Qualquer Host que não seja o server_name abaixo fecha a ligação sem resposta (444).
    # Usa o mesmo certificado: um cliente que liga a um IP não manda SNI e o handshake
    # acontece sempre neste server; ssl_reject_handshake partiria esses clientes.
    # serve.ts continua a verificar o Host (421) por trás desta primeira barreira.
    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name _;
        return 444;
    }

    server {
        listen 127.0.0.1:8443 ssl;
        # O nome do certificado e de JORAA_MCP_ALLOWED_HOSTS. Ao mudar um, mudam os três.
        server_name mcp.example.test;

        limit_conn perip 10;

        client_max_body_size 64k;
        client_body_buffer_size 64k;

        # Todos os proxy_set_header ficam neste nível. Um só dentro de location descarta
        # todos os herdados e o Host passa a ser $proxy_host. Com o upstream "joraa" isso dá
        # 421 em tudo (testado); com proxy_pass http://127.0.0.1:3000 seria "127.0.0.1:3000",
        # sempre permitido por serve.ts, e a verificação de Host deixava de servir sem aviso.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Origin não é alterado: o nginx passa os cabeçalhos do cliente por omissão.
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # Respostas grandes ficam em memória (buffers) e nunca em disco: /var/cache/nginx é tmpfs.
        proxy_max_temp_file_size 0;

        location = /mcp {
            limit_req zone=mcp burst=20 nodelay;
            proxy_pass http://joraa;
        }

        location = /health {
            limit_req zone=other burst=10 nodelay;
            proxy_pass http://joraa;
        }

        # "return" corre antes do limit_req (fase rewrite); try_files corre depois,
        # por isso o limite também se aplica aqui.
        location / {
            limit_req zone=other burst=10 nodelay;
            root /var/empty;
            try_files /.nada =404;
        }
    }
}
