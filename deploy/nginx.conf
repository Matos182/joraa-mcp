worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;
    limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;
    # 429 indica excesso de pedidos e leva os clientes a abrandar; 503 pareceria uma indisponibilidade.
    limit_req_status 429;

    upstream joraa {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    # Sem HTTP: 301/302 podem transformar POST em GET; com 307/308 o corpo JSON-RPC
    # já teria passado em claro. Os clientes MCP usam um URL https, sem superfície em claro.
    # Não se inclui conf.d/*.conf: o default.conf da imagem abriria a porta 80 no anfitrião.
    server {
        listen 127.0.0.1:8443 ssl;
        server_name localhost;
        # Este é o único server: nomes desconhecidos também chegam aqui com o Host original.
        # Não há default_server de rejeição: é serve.ts que decide e o teste pelo proxy prova-o.

        ssl_certificate /etc/nginx/certs/joraa.crt;
        ssl_certificate_key /etc/nginx/certs/joraa.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Perfil "intermediate" do TLSRef (sucessor do Mozilla SSL Config, guidelines 6.0).
        # Sem isto o TLS 1.2 usaria o valor por omissão HIGH:!aNULL:!MD5, que ainda aceita CBC sem ECDHE.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        client_max_body_size 64k;
        client_body_buffer_size 64k;

        # Todos os proxy_set_header ficam neste nível. Um só dentro de location descarta
        # todos os herdados e o Host passa a ser $proxy_host. Com o upstream "joraa" isso dá
        # 421 em tudo (testado); com proxy_pass http://127.0.0.1:3000 seria "127.0.0.1:3000",
        # sempre permitido por serve.ts, e a verificação de Host deixava de servir sem aviso.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Origin não é alterado: o nginx passa os cabeçalhos do cliente por omissão.
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        location = /mcp {
            limit_req zone=mcp burst=20 nodelay;
            proxy_pass http://joraa;
        }

        location = /health {
            proxy_pass http://joraa;
        }

        location / {
            return 404;
        }
    }
}
